[build]
  command = "echo 'Build complete'"
  publish = "."

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/projects.html"
  to = "/portfolio.html"
  status = 301

# Former standalone pages are now homepage sections
[[redirects]]
  from = "/resume.html"
  to = "/#resume"
  status = 301

[[redirects]]
  from = "/Resume.html"
  to = "/#resume"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/#about"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/#contact"
  status = 301
