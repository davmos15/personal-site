<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Nadav Moskow</title>
  <meta name="description" content="Get in touch with Nadav Moskow by email or the contact form.">
  <link rel="shortcut icon" type="image/png" href="/NM1.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="nav-placeholder"></div>

<main id="main">
  <div class="wrap">
    <section class="contact-grid">

      <div class="contact-intro">
        <p class="section-label">Contact</p>
        <h1>Let's talk.</h1>
        <p>Whether it's a role, a project, or just a chat about automation, AI or the next marathon — I'd love to hear from you.</p>
        <a class="contact-direct" href="mailto:moskownadav@gmail.com">
          <i class="ti ti-mail" aria-hidden="true"></i> moskownadav@gmail.com
        </a>
      </div>

      <form class="contact-form" name="contact" method="post" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="contact" />
        <!-- Honeypot spam trap -->
        <p class="hp-field" aria-hidden="true">
          <label>Don't fill this out if you're human: <input name="bot-field" tabindex="-1" autocomplete="off" /></label>
        </p>

        <div class="field">
          <label for="name">Name</label>
          <input id="name" type="text" name="Name" placeholder="Your name" required
                 oninvalid="this.setCustomValidity('Please enter your name')" oninput="setCustomValidity('')" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" name="Email" placeholder="you@example.com" required
                 oninvalid="this.setCustomValidity('Please enter a valid email address')" oninput="setCustomValidity('')" />
        </div>
        <div class="field">
          <label for="phone">Phone <span style="font-weight:400;color:var(--text-muted)">(optional)</span></label>
          <input id="phone" type="tel" name="Phone Number" placeholder="Your phone number" />
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="Message" placeholder="Type your message" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary"><i class="ti ti-send" aria-hidden="true"></i> Send message</button>
      </form>

    </section>
  </div>
</main>

<div id="footer-placeholder"></div>

<script src="script.js" charset="utf-8"></script>
</body>
</html>
